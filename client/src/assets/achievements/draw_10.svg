<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="draw_10-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <radialGradient id="draw_10-glow" cx="50%" cy="43%" r="55%">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="draw_10-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#a9c0ea"/>
    </linearGradient>
    <linearGradient id="draw_10-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3348"/>
      <stop offset="1" stop-color="#1d2331"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" fill="url(#draw_10-bg)"/>
  <ellipse cx="150" cy="186" rx="150" ry="166" fill="url(#draw_10-glow)"/>

  <!-- the deck at the base -->
  <g opacity=".95">
    <rect x="90" y="292" width="120" height="120" rx="10" fill="url(#draw_10-back)" stroke="#39435e" transform="rotate(-8 150 352)"/>
    <rect x="96" y="298" width="120" height="120" rx="10" fill="url(#draw_10-back)" stroke="#39435e" transform="rotate(-3 156 358)"/>
    <rect x="100" y="304" width="120" height="120" rx="10" fill="url(#draw_10-back)" stroke="#4f8cff" stroke-opacity=".45"/>
  </g>

  <!-- three cards fanning up out of the deck -->
  <g transform="rotate(-19 150 302)">
    <rect x="108" y="182" width="84" height="120" rx="9" fill="#0d1017" opacity=".5" transform="translate(3 6)"/>
    <rect x="108" y="182" width="84" height="120" rx="9" fill="url(#draw_10-face)" stroke="#dce7fb"/>
    <rect x="114" y="188" width="72" height="108" rx="6" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
  </g>
  <g transform="rotate(19 150 302)">
    <rect x="108" y="182" width="84" height="120" rx="9" fill="#0d1017" opacity=".5" transform="translate(3 6)"/>
    <rect x="108" y="182" width="84" height="120" rx="9" fill="url(#draw_10-face)" stroke="#dce7fb"/>
    <rect x="114" y="188" width="72" height="108" rx="6" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
  </g>
  <g>
    <rect x="108" y="180" width="84" height="122" rx="9" fill="#0d1017" opacity=".5" transform="translate(3 7)"/>
    <rect x="108" y="180" width="84" height="122" rx="9" fill="url(#draw_10-face)" stroke="#dce7fb"/>
    <rect x="114" y="186" width="72" height="110" rx="6" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
    <path d="M 0 0 l -30 54 l 20 0 l -8 44 l 32 -56 l -21 0 z" transform="translate(156 205) scale(.66)" fill="#3b6fd8"/>
  </g>

  <!-- sparks of the pull -->
  <g fill="#8fb6ff">
    <circle cx="214" cy="150" r="3.5" opacity=".9"/>
    <circle cx="232" cy="196" r="2.5" opacity=".7"/>
    <circle cx="82" cy="168" r="3" opacity=".85"/>
    <circle cx="66" cy="214" r="2.2" opacity=".6"/>
    <circle cx="238" cy="120" r="2" opacity=".55"/>
    <circle cx="150" cy="150" r="2.4" opacity=".7"/>
  </g>
</svg>
