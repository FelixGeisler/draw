<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="ms-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14262b"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <radialGradient id="ms-glow" cx="50%" cy="44%" r="54%">
      <stop offset="0" stop-color="#3fbf7f" stop-opacity=".32"/>
      <stop offset="1" stop-color="#3fbf7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ms-scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fdba5"/>
      <stop offset=".5" stop-color="#2f9a6e"/>
      <stop offset="1" stop-color="#174535"/>
    </linearGradient>
    <linearGradient id="ms-blade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7d8aa6"/>
      <stop offset=".5" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#9aa7c2"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" fill="url(#ms-bg)"/>
  <ellipse cx="150" cy="184" rx="150" ry="160" fill="url(#ms-glow)"/>

  <!-- The beast and the blade are composed inside y≈30..300: the card's
       caption band covers the foot of the face. -->
  <g transform="translate(0 -34)">

  <!-- neck coiling away behind -->
  <path d="M232 300 C 208 264 214 226 236 196" fill="none" stroke="#1d5a45" stroke-width="30"
        stroke-linecap="round" opacity=".85"/>

  <!-- wing membrane -->
  <path d="M214 150 C 254 116 282 132 288 168 C 268 156 252 162 242 176
           C 258 180 266 190 268 206 C 244 192 226 190 208 198 Z"
        fill="#1d5a45" opacity=".9"/>

  <!-- horns sweeping back off the skull -->
  <path d="M196 118 L262 78 L226 132 Z" fill="#174535"/>
  <path d="M186 112 L214 66 L212 122 Z" fill="#2f9a6e"/>

  <!-- the head, in profile facing left: long snout, heavy brow, open jaw -->
  <path d="M30 214
           C 60 196 96 182 132 174
           C 166 166 196 152 214 132
           C 240 152 246 190 234 218
           C 224 242 200 254 172 254
           L 150 254
           C 108 254 62 238 30 214 Z"
        fill="url(#ms-scale)"/>
  <!-- lower jaw, dropped open -->
  <path d="M44 234 C 78 258 120 274 164 276 L206 268 C 190 292 160 302 128 296
           C 92 290 62 266 44 234 Z" fill="#174535"/>
  <!-- teeth along the upper jaw -->
  <g fill="#f4f8ff">
    <path d="M44 220 L52 240 L62 224 Z"/>
    <path d="M72 232 L80 252 L90 234 Z"/>
    <path d="M104 242 L112 262 L122 244 Z"/>
    <path d="M138 248 L146 266 L156 250 Z"/>
  </g>
  <!-- brow ridge + eye -->
  <path d="M158 178 C 180 168 202 168 218 178" fill="none" stroke="#174535" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="188" cy="196" rx="15" ry="12" fill="#0d1017"/>
  <ellipse cx="188" cy="196" rx="9" ry="7" fill="#ffb64f"/>
  <ellipse cx="188" cy="196" rx="2.8" ry="7" fill="#0d1017"/>
  <!-- nostril at the tip of the snout -->
  <circle cx="52" cy="212" r="4.5" fill="#0d1017" opacity=".85"/>

  <!-- the slayer's sword, driven down through the skull -->
  <g transform="rotate(21 150 230)">
    <path d="M150 62 L163 92 L163 274 L137 274 L137 92 Z" fill="url(#ms-blade)"/>
    <path d="M150 62 L157 90 L150 274 L143 90 Z" fill="#ffffff" opacity=".5"/>
    <rect x="106" y="274" width="88" height="14" rx="7" fill="#ffb64f"/>
    <rect x="141" y="288" width="18" height="48" rx="5" fill="#3a3547"/>
    <circle cx="150" cy="342" r="11" fill="#ffb64f"/>
  </g>

  </g>
</svg>
