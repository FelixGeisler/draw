<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="draw_1000-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182747"/>
      <stop offset=".55" stop-color="#121a2c"/>
      <stop offset="1" stop-color="#0d1019"/>
    </linearGradient>
    <radialGradient id="draw_1000-glow" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="draw_1000-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dbe8ff" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#6fa1ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="draw_1000-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#a9c0ea"/>
