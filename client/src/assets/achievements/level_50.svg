<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="level_50-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a44"/>
      <stop offset=".55" stop-color="#161528"/>
      <stop offset="1" stop-color="#0c0d13"/>
    </linearGradient>
    <radialGradient id="level_50-glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff2c0" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#ffb64f" stop-opacity=".24"/>
      <stop offset=".75" stop-color="#7a5cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="level_50-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffb64f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="level_50-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#fff2c0"/>
      <stop offset=".7" stop-color="#ffce6a"/>
      <stop offset="1" stop-color="#ffb64f"/>
    </linearGradient>
    <linearGradient id="level_50-comp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf3"/>
      <stop offset="1" stop-color="#ffc766"/>
    </linearGradient>
    <linearGradient id="level_50-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe08a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="level_50-trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" fill="url(#level_50-bg)"/>
  <ellipse cx="150" cy="176" rx="160" ry="168" fill="url(#level_50-glow)"/>

  <!-- deep field: a rich sky -->
  <g>
    <circle cx="30" cy="52" r="1.8" fill="#a9c6ff" opacity=".7"/>
    <circle cx="272" cy="44" r="2" fill="#a9c6ff" opacity=".6"/>
    <circle cx="292" cy="120" r="1.5" fill="#ffe08a" opacity=".55"/>
    <circle cx="10" cy="128" r="1.5" fill="#ffe08a" opacity=".5"/>
    <circle cx="46" cy="300" r="1.6" fill="#a9c6ff" opacity=".5"/>
    <circle cx="256" cy="308" r="1.6" fill="#a9c6ff" opacity=".5"/>
    <circle cx="150" cy="392" r="1.5" fill="#ffe08a" opacity=".45"/>
    <circle cx="20" cy="230" r="1.3" fill="#a9c6ff" opacity=".4"/>
    <circle cx="282" cy="238" r="1.3" fill="#a9c6ff" opacity=".4"/>
  </g>

  <!-- the summit climb: the tallest ascent -->
  <g stroke="#2c3040" stroke-width="3" stroke-linecap="round">
    <path d="M84 404 H216" opacity=".9"/>
    <path d="M93 380 H207" opacity=".77"/>
    <path d="M102 356 H198" opacity=".64"/>
    <path d="M111 332 H189" opacity=".51"/>
    <path d="M120 308 H180" opacity=".39"/>
    <path d="M129 284 H171" opacity=".28"/>
  </g>

  <!-- ascent trail into the summit -->
  <path d="M140 300 L150 258 L160 300 Z" fill="url(#level_50-trail)"/>

  <g transform="translate(150 176)">
    <!-- twelve rays: the summit shine -->
    <g fill="url(#level_50-ray)">
      <rect x="-3.5" y="-190" width="7" height="380" rx="3.5"/>
      <rect x="-3.5" y="-190" width="7" height="380" rx="3.5" transform="rotate(90)"/>
      <rect x="-2.6" y="-166" width="5.2" height="332" rx="2.6" transform="rotate(30)" opacity=".72"/>
      <rect x="-2.6" y="-166" width="5.2" height="332" rx="2.6" transform="rotate(60)" opacity=".72"/>
      <rect x="-2.6" y="-166" width="5.2" height="332" rx="2.6" transform="rotate(120)" opacity=".72"/>
      <rect x="-2.6" y="-166" width="5.2" height="332" rx="2.6" transform="rotate(150)" opacity=".72"/>
    </g>
    <!-- the crown's haloes -->
    <circle r="112" fill="none" stroke="#ffe08a" stroke-opacity=".3" stroke-width="2"/>
    <circle r="132" fill="none" stroke="#7a5cff" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="5 10"/>
    <circle r="150" fill="none" stroke="#ffe08a" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 10"/>
  </g>

  <!-- crown connectors: hero apex to the topmost stars -->
  <g stroke="#ffe08a" stroke-opacity=".26" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M150 80 L150 44"/>
    <path d="M150 80 L227.6 69.2"/>
    <path d="M150 80 L72.4 69.2"/>
  </g>

  <!-- the crown of stars -->
  <g>
    <g transform="translate(150 44) scale(.167)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
    <g transform="translate(227.6 69.2) scale(.143)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
    <g transform="translate(72.4 69.2) scale(.143)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
    <g transform="translate(275.5 135.2) scale(.119)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
    <g transform="translate(24.5 135.2) scale(.119)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
    <g transform="translate(275.5 216.8) scale(.107)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
    <g transform="translate(24.5 216.8) scale(.107)">
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="#0d1017" opacity=".5" transform="translate(6 10)"/>
      <path d="M0 -84 L24.7 -26 L86 -19.5 L40 21.5 L53 84 L0 52 L-53 84 L-40 21.5 L-86 -19.5 L-24.7 -26 Z" fill="url(#level_50-comp)"/>
    </g>
  </g>

  <!-- central super-star: the summit -->
  <ellipse cx="150" cy="176" rx="72" ry="72" fill="url(#level_50-core)"/>
  <g transform="translate(150 176)">
    <path d="M0 -96 L28.2 -29.7 L98.3 -22.3 L45.7 24.6 L60.6 96 L0 59.4 L-60.6 96 L-45.7 24.6 L-98.3 -22.3 L-28.2 -29.7 Z" fill="#0d1017" opacity=".5" transform="translate(4 10)"/>
    <path d="M0 -96 L28.2 -29.7 L98.3 -22.3 L45.7 24.6 L60.6 96 L0 59.4 L-60.6 96 L-45.7 24.6 L-98.3 -22.3 L-28.2 -29.7 Z" fill="url(#level_50-star)"/>
    <path d="M0 -96 L28.2 -29.7 L98.3 -22.3 L45.7 24.6 L60.6 96 L0 59.4 Z" fill="#e0902c" opacity=".18"/>
    <path d="M0 -62 L18 -20 L62 -15 L29 15 L38 61 L0 38 Z" fill="#fffdf5" opacity=".5"/>
    <circle cx="0" cy="-6" r="9" fill="#fffdf5" opacity=".55"/>
  </g>

  <!-- brilliant sparks -->
  <g fill="#fff2c0">
    <circle cx="150" cy="30" r="3.2" opacity=".9"/>
    <circle cx="66" cy="60" r="2.6" opacity=".75"/>
    <circle cx="238" cy="60" r="2.6" opacity=".75"/>
    <circle cx="40" cy="200" r="2.2" opacity=".6"/>
    <circle cx="262" cy="204" r="2.2" opacity=".6"/>
    <circle cx="150" cy="352" r="2.4" opacity=".55"/>
  </g>
</svg>
