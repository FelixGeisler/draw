    <rect x="118" y="213" width="64" height="96" rx="5" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
  </g>
  <g transform="rotate(-26 150 314)">
    <rect x="113" y="208" width="74" height="106" rx="8" fill="#0d1017" opacity=".5" transform="translate(3 6)"/>
    <rect x="113" y="208" width="74" height="106" rx="8" fill="url(#draw_100-face)" stroke="#dce7fb"/>
    <rect x="118" y="213" width="64" height="96" rx="5" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
  </g>
  <g transform="rotate(26 150 314)">
    <rect x="113" y="208" width="74" height="106" rx="8" fill="#0d1017" opacity=".5" transform="translate(3 6)"/>
    <rect x="113" y="208" width="74" height="106" rx="8" fill="url(#draw_100-face)" stroke="#dce7fb"/>
    <rect x="118" y="213" width="64" height="96" rx="5" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
  </g>
  <g transform="rotate(9 150 314)">
    <rect x="113" y="208" width="74" height="106" rx="8" fill="#0d1017" opacity=".5" transform="translate(3 6)"/>
    <rect x="113" y="208" width="74" height="106" rx="8" fill="url(#draw_100-face)" stroke="#dce7fb"/>
    <rect x="118" y="213" width="64" height="96" rx="5" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
  </g>
  <g transform="rotate(-9 150 314)">
    <rect x="113" y="208" width="74" height="106" rx="8" fill="#0d1017" opacity=".5" transform="translate(3 6)"/>
    <rect x="113" y="208" width="74" height="106" rx="8" fill="url(#draw_100-face)" stroke="#dce7fb"/>
    <rect x="118" y="213" width="64" height="96" rx="5" fill="none" stroke="#4f8cff" stroke-opacity=".5"/>
    <path d="M 0 0 l -30 54 l 20 0 l -8 44 l 32 -56 l -21 0 z" transform="translate(155 232) scale(.6)" fill="#3b6fd8"/>
  </g>

  <!-- sparks of the cascade -->
