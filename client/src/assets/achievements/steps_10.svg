<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="st10-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20190f"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <radialGradient id="st10-glow" cx="50%" cy="44%" r="54%">
      <stop offset="0" stop-color="#3fbf7f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3fbf7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st10-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset=".55" stop-color="#a8683a"/>
      <stop offset="1" stop-color="#6e4223"/>
    </linearGradient>
    <linearGradient id="st10-rung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a967"/>
      <stop offset="1" stop-color="#7c4d29"/>
    </linearGradient>
    <linearGradient id="st10-flag" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd48b"/>
      <stop offset="1" stop-color="#ffb64f"/>
    </linearGradient>
    <radialGradient id="st10-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb64f" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffb64f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="420" fill="url(#st10-bg)"/>
  <ellipse cx="150" cy="184" rx="150" ry="160" fill="url(#st10-glow)"/>

  <!-- The climb is composed inside y = 40..300: the ladder ends at its
       tenth rung inside the low cloud bank, clear of the caption band. -->

  <!-- faint high-air stars -->
  <g fill="#f4f8ff">
    <circle cx="44" cy="62" r="1.6" opacity=".55"/>
    <circle cx="104" cy="48" r="1.2" opacity=".45"/>
    <circle cx="66" cy="88" r="1" opacity=".4"/>
    <circle cx="262" cy="46" r="1.4" opacity=".5"/>
  </g>

  <!-- far cloud shelf, drifting behind the ladder -->
  <g fill="#8fa3bd" opacity=".3">
    <ellipse cx="58" cy="126" rx="28" ry="15"/>
    <ellipse cx="92" cy="116" rx="32" ry="18"/>
    <ellipse cx="122" cy="128" rx="24" ry="13"/>
    <ellipse cx="86" cy="134" rx="40" ry="13"/>
  </g>
  <ellipse cx="92" cy="107" rx="22" ry="7" fill="#f4f8ff" opacity=".14"/>

  <!-- mid cloud slipping off the right edge -->
  <g fill="#8fa3bd" opacity=".24">
    <ellipse cx="243" cy="172" rx="30" ry="15"/>
    <ellipse cx="268" cy="162" rx="22" ry="12"/>
    <ellipse cx="254" cy="180" rx="34" ry="12"/>
  </g>

  <!-- warm halo around the summit flag -->
  <ellipse cx="200" cy="61" rx="62" ry="38" fill="url(#st10-flare)"/>

  <!-- the ladder: ten honest rungs, rising out of the low clouds -->
  <g transform="translate(213 65) rotate(22)">
    <g fill="url(#st10-rung)">
      <rect x="-27" y="16" width="54" height="8" rx="3"/>
      <rect x="-27" y="40" width="54" height="8" rx="3"/>
      <rect x="-27" y="64" width="54" height="8" rx="3"/>
      <rect x="-27" y="88" width="54" height="8" rx="3"/>
      <rect x="-27" y="112" width="54" height="8" rx="3"/>
      <rect x="-27" y="136" width="54" height="8" rx="3"/>
      <rect x="-27" y="160" width="54" height="8" rx="3"/>
      <rect x="-27" y="184" width="54" height="8" rx="3"/>
      <rect x="-27" y="208" width="54" height="8" rx="3"/>
      <rect x="-27" y="232" width="54" height="8" rx="3"/>
    </g>
    <!-- flag-light kissing the top rung -->
    <rect x="-27" y="16" width="54" height="2.5" rx="1.2" fill="#ffd48b" opacity=".5"/>
    <!-- side rails, ending flush with the tenth rung -->
    <rect x="-32" y="-8" width="12" height="248" rx="5" fill="url(#st10-wood)"/>
    <rect x="20" y="-8" width="12" height="248" rx="5" fill="url(#st10-wood)"/>
    <!-- lit edges, green ambient rim, cast shadow -->
    <rect x="-32" y="-8" width="3" height="248" rx="1.5" fill="#3fbf7f" opacity=".45"/>
    <rect x="20" y="-8" width="2.5" height="248" rx="1.2" fill="#e2a967" opacity=".6"/>
    <rect x="29.5" y="-8" width="2.5" height="248" rx="1.2" fill="#0d1017" opacity=".38"/>
    <!-- gold light on the rail tops -->
    <rect x="-32" y="-8" width="12" height="5" rx="2.5" fill="#ffce7f" opacity=".55"/>
    <rect x="20" y="-8" width="12" height="5" rx="2.5" fill="#ffce7f" opacity=".55"/>
    <!-- wood grain -->
    <rect x="-27.5" y="70" width="2.5" height="16" rx="1.2" fill="#0d1017" opacity=".22"/>
    <rect x="24" y="140" width="2.5" height="18" rx="1.2" fill="#0d1017" opacity=".22"/>
    <rect x="-27.5" y="200" width="2.5" height="14" rx="1.2" fill="#0d1017" opacity=".22"/>
  </g>

  <!-- soft cloud drifting across the ladder, green underlight below it -->
  <ellipse cx="150" cy="248" rx="70" ry="16" fill="#3fbf7f" opacity=".12"/>
  <g fill="#aebfd6" opacity=".5">
    <ellipse cx="112" cy="238" rx="40" ry="20"/>
    <ellipse cx="156" cy="228" rx="46" ry="24"/>
    <ellipse cx="198" cy="240" rx="34" ry="17"/>
    <ellipse cx="152" cy="248" rx="64" ry="16"/>
  </g>
  <ellipse cx="150" cy="214" rx="30" ry="9" fill="#f4f8ff" opacity=".3"/>
  <ellipse cx="110" cy="226" rx="18" ry="6" fill="#f4f8ff" opacity=".2"/>

  <!-- low cloud bank the ladder climbs out of -->
  <g fill="#9db1c9" opacity=".38">
    <ellipse cx="66" cy="300" rx="62" ry="22"/>
    <ellipse cx="150" cy="294" rx="72" ry="26"/>
    <ellipse cx="236" cy="302" rx="60" ry="21"/>
  </g>
  <ellipse cx="150" cy="276" rx="40" ry="8" fill="#f4f8ff" opacity=".16"/>

  <!-- the summit flag, lashed to the top of the ladder with green cord -->
  <rect x="229" y="42" width="5" height="52" rx="2.5" fill="#6e4223"/>
  <rect x="229" y="42" width="2" height="52" rx="1" fill="#e2a967" opacity=".8"/>
  <rect x="224" y="78" width="16" height="4.5" rx="2.2" fill="#3fbf7f"/>
  <rect x="225" y="86" width="15" height="4.5" rx="2.2" fill="#2f9a6e"/>
  <path d="M229 46 L162 61 L229 78 Z" fill="url(#st10-flag)"/>
  <path d="M229 46 L162 61 L229 63 Z" fill="#ffe2ae" opacity=".45"/>
  <path d="M229 70 L188 64 L229 78 Z" fill="#c77f24" opacity=".5"/>
  <circle cx="231.5" cy="42" r="4" fill="#ffb64f"/>
  <circle cx="230.2" cy="40.8" r="1.5" fill="#ffe2ae"/>
</svg>
