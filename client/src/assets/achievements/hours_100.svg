<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="hours_100-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a47"/>
      <stop offset="1" stop-color="#101d24"/>
    </linearGradient>
    <radialGradient id="hours_100-glow" cx="50%" cy="50%" r="52%">
      <stop offset="0" stop-color="#4fd0e0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4fd0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hours_100-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe4f2"/>
      <stop offset="1" stop-color="#2f7f8c"/>
    </linearGradient>
    <linearGradient id="hours_100-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff0f7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#4fd0e0" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="hours_100-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f7fb"/>
      <stop offset="1" stop-color="#4fd0e0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" fill="url(#hours_100-bg)"/>
  <ellipse cx="150" cy="210" rx="140" ry="160" fill="url(#hours_100-glow)"/>

  <!-- faint clock ring behind the glass -->
  <circle cx="150" cy="210" r="126" fill="none" stroke="#4fd0e0" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="150" cy="210" r="112" fill="none" stroke="#4fd0e0" stroke-opacity=".16" stroke-width="1"/>
  <g fill="#7fe0ee" opacity=".55">
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(0 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(30 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(60 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(90 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(120 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(150 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(180 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(210 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(240 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(270 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(300 150 210)"/>
    <rect x="148.5" y="84" width="3" height="11" transform="rotate(330 150 210)"/>
  </g>

  <!-- drop shadow -->
  <g fill="#0d1017" opacity=".5" transform="translate(4 6)">
    <path d="M100 120 L200 120 L150 210 Z"/>
    <path d="M150 210 L200 300 L100 300 Z"/>
  </g>

  <!-- glass body -->
  <path d="M100 120 L200 120 L150 210 Z" fill="url(#hours_100-glass)" stroke="#6fe4f2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M150 210 L200 300 L100 300 Z" fill="url(#hours_100-glass)" stroke="#6fe4f2" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- top sand (fuller) -->
  <path d="M108 126 L192 126 L166 176 L134 176 Z" fill="url(#hours_100-sand)"/>
  <rect x="147" y="208" width="6" height="90" fill="url(#hours_100-sand)"/>
  <!-- bottom pile (bigger) -->
  <path d="M104 298 Q150 250 196 298 Z" fill="url(#hours_100-sand)"/>

  <!-- caps -->
  <rect x="88" y="108" width="124" height="13" rx="4" fill="url(#hours_100-cap)"/>
  <rect x="88" y="299" width="124" height="13" rx="4" fill="url(#hours_100-cap)"/>

  <!-- highlight -->
  <path d="M114 126 L124 126 L150 200 Z" fill="#ffffff" opacity=".14"/>

  <!-- sparks -->
  <g fill="#a8ecf3">
    <circle cx="222" cy="150" r="4" opacity=".9"/>
    <circle cx="238" cy="210" r="3" opacity=".7"/>
    <circle cx="228" cy="272" r="2.5" opacity=".6"/>
    <circle cx="74" cy="160" r="3.5" opacity=".8"/>
    <circle cx="62" cy="224" r="2.5" opacity=".6"/>
    <circle cx="80" cy="284" r="2.5" opacity=".55"/>
    <circle cx="150" cy="60" r="4.5" opacity=".9"/>
  </g>
</svg>
