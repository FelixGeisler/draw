<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <!-- Composed inside y≈30..300: the caption band covers the foot of the face,
       so the horizon sits mid-card and the bird above it. -->
  <defs>
    <linearGradient id="eb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182642"/>
      <stop offset=".5" stop-color="#3d3350"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <radialGradient id="eb-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb64f" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffb64f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eb-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="eb-bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2ff"/>
      <stop offset=".5" stop-color="#3d6fd0"/>
      <stop offset="1" stop-color="#1d3a75"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" fill="url(#eb-bg)"/>

  <!-- first light, still below the ridge -->
  <ellipse cx="150" cy="252" rx="170" ry="130" fill="url(#eb-halo)"/>
  <path d="M150 252 L150 96 A156 156 0 0 1 250 132 Z" fill="#ffb64f" opacity=".13"/>
  <path d="M150 252 L50 132 A156 156 0 0 1 150 96 Z" fill="#ffb64f" opacity=".1"/>
  <circle cx="150" cy="252" r="74" fill="url(#eb-sun)"/>

  <!-- the ridge the day has not cleared yet -->
  <path d="M0 262 C 60 252 90 268 150 266 C 216 264 250 250 300 260 L300 420 L0 420 Z" fill="#191c27"/>
  <path d="M0 262 C 60 252 90 268 150 266 C 216 264 250 250 300 260" fill="none" stroke="#ffb64f" stroke-opacity=".22" stroke-width="2"/>

  <!-- the branch -->
  <path d="M300 214 C 254 208 216 198 172 186" fill="none" stroke="#2f2a35" stroke-width="9" stroke-linecap="round"/>
  <path d="M232 200 C 240 184 256 174 272 170" fill="none" stroke="#2f2a35" stroke-width="5" stroke-linecap="round"/>
  <g fill="#3fbf7f" opacity=".8">
    <ellipse cx="276" cy="166" rx="11" ry="6" transform="rotate(-24 276 166)"/>
    <ellipse cx="254" cy="178" rx="9" ry="5" transform="rotate(-18 254 178)"/>
  </g>

  <!-- the bird, up before the sun clears the ridge -->
  <g transform="translate(0 -60)">
    <path d="M196 224 L246 242 L200 250 Z" fill="#1d3a75"/>
    <path d="M196 224 C 176 194 140 186 118 204 C 96 222 96 254 118 268
             C 140 282 178 276 200 250 Z" fill="url(#eb-bird)"/>
    <path d="M170 216 C 152 210 132 218 126 236 C 142 246 166 244 180 230 Z" fill="#9fc6ff" opacity=".9"/>
    <circle cx="122" cy="214" r="24" fill="url(#eb-bird)"/>
    <path d="M108 200 C 112 186 122 178 132 176 C 128 186 128 194 130 200 Z" fill="#1d3a75"/>
    <circle cx="114" cy="209" r="5.5" fill="#0d1017"/>
    <circle cx="112" cy="207" r="1.8" fill="#e8eaf0"/>
    <path d="M100 216 L74 210 L100 224 Z" fill="#ffb64f"/>
    <path d="M100 224 L78 228 L100 230 Z" fill="#e07f2c"/>
    <g stroke="#e07f2c" stroke-width="3" stroke-linecap="round">
      <path d="M150 268 L150 284 M150 284 L142 292 M150 284 L158 292"/>
      <path d="M176 262 L178 278 M178 278 L170 286 M178 278 L186 286"/>
    </g>
  </g>

  <!-- the early song -->
  <g stroke="#ffe08a" stroke-width="3" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M58 130 C 48 138 48 154 58 162"/>
    <path d="M42 118 C 26 132 26 160 42 174"/>
  </g>
</svg>
