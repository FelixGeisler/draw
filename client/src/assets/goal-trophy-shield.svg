<svg xmlns="http://www.w3.org/2000/svg" viewBox="102 144 98 148" width="98" height="148">
  <!-- Trophy variant "shield" (#204): a heraldic crest on a footed base — a
       raised border band around a recessed field, a chevron across the upper
       half. Broad and flat where the classic cup is a hollow vessel. Same
       palette and shadow technique as goal-trophy.svg; base at y=280,
       centred on x=150. -->
  <defs>
    <linearGradient id="goal-trophy-shield-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffefbe"/>
      <stop offset=".45" stop-color="#f6bd50"/>
      <stop offset="1" stop-color="#bf7d25"/>
    </linearGradient>
  </defs>

  <!-- drop shadow -->
  <g transform="translate(4 7)" opacity=".45">
    <path d="M108 150 L192 150 L192 186 C192 216 174 236 150 246 C126 236 108 216 108 186 Z" fill="#0d1017"/>
    <path d="M144 238 L156 238 L157 262 L143 262 Z" fill="#0d1017"/>
    <path d="M130 262 L170 262 L174 270 L126 270 Z" fill="#0d1017"/>
    <path d="M120 270 L180 270 L180 280 L120 280 Z" fill="#0d1017"/>
  </g>

  <!-- foot + stepped base -->
  <path d="M144 238 L156 238 L157 262 L143 262 Z" fill="url(#goal-trophy-shield-gold)"/>
  <path d="M130 262 L170 262 L174 270 L126 270 Z" fill="url(#goal-trophy-shield-gold)"/>
  <path d="M120 270 L180 270 L180 280 L120 280 Z" fill="url(#goal-trophy-shield-gold)"/>

  <!-- the shield: raised border, recessed field, chevron -->
  <path d="M108 150 L192 150 L192 186 C192 216 174 236 150 246 C126 236 108 216 108 186 Z" fill="url(#goal-trophy-shield-gold)"/>
  <path d="M118 160 L182 160 L182 186 C182 211 167 228 150 237 C133 228 118 211 118 186 Z" fill="#8a5616" opacity=".5"/>
  <path d="M128 198 L150 182 L172 198 L172 209 L150 193 L128 209 Z" fill="url(#goal-trophy-shield-gold)"/>

  <!-- top-edge highlight, right-edge shade -->
  <path d="M108 150 L192 150 L192 156 L108 156 Z" fill="#fff6dc" opacity=".22"/>
  <path d="M170 156 L182 156 L182 190 C182 214 168 230 152 240 L150 246 C174 236 192 216 192 186 L192 156 Z" fill="#000000" opacity=".14"/>

  <!-- base edges -->
  <path d="M130 270 L170 270" stroke="#fff6dc" stroke-opacity=".3" stroke-width="2"/>
  <path d="M120 280 L180 280" stroke="#000000" stroke-opacity=".18" stroke-width="3"/>
</svg>
