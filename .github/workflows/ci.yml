name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schedule-timezone-runtime:
    name: Schedule timezone registry (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frozen tzdb registry and UTC boundary gate
        run: npm run test -w server -- --run test/unit/fixed-slots.test.ts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type checks
        run: npm run build -w server && npx tsc --noEmit -p client/tsconfig.json
      - name: Unit + integration tests
        run: npm test
      - name: Documentation build
        run: npm run docs:build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
